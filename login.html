<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign In | LensCraft Photography Studio</title>
    <script src="tailwind.js"></script>
    <link rel="icon" type="image/jpeg" href="images/camera-favicon.png">
    <link rel="icon" type="image/png" href="images/camera-favicon.png">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontWeight: {
                        semibold: '500',
                        bold: '600',
                        extrabold: '800',
                        black: '900'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           CORE STYLES & VARIABLES (LENSCRAFT THEME)
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* STRICT NO SCROLL LOCK FROM TEMPLATE */
        html,
        body {
            height: 100vh !important;
            width: 100vw !important;
            overflow: hidden !important;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* === LENSCRAFT NEW GLASS THEME VARIABLES === */
        :root {
            /* Backgrounds */
            --bg-color: #FAFAFA;
            --bg-secondary: #F0F9FF;

            /* Glass Card & Text */
            --bg-card: rgba(255, 255, 255, 0.85);
            --card-border: rgba(255, 255, 255, 0.4);
            --text-main: #0F172A;
            --text-muted: #475569;

            /* Inputs */
            --input-bg: rgba(255, 255, 255, 0.6);
            --input-border: rgba(0, 0, 0, 0.1);
            --input-focus-bg: #FFFFFF;
            --input-text: #0F172A;
            --input-icon: #64748B;

            --page-text: #475569;
            --toggle-bg: #E2E8F0;

            /* Accents & Buttons */
            --accent-color: #0EA5E9;
            --accent-hover: #0284C7;
            --btn-text: #FFFFFF;

            --radius: 30px; /* More rounded for new design */
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            --btn-shadow: 0 4px 10px 0 rgba(14, 165, 233, 0.2);
            --btn-shadow-hover: 0 8px 15px -3px rgba(14, 165, 233, 0.4);
        }

        /* DARK MODE */
        body.dark-mode {
            --bg-color: #0F172A;
            --bg-secondary: #1E293B;

            --bg-card: rgba(15, 23, 42, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;

            --input-bg: rgba(0, 0, 0, 0.3);
            --input-border: rgba(255, 255, 255, 0.1);
            --input-focus-bg: rgba(0, 0, 0, 0.6);
            --input-text: #F8FAFC;
            --input-icon: #94A3B8;

            --page-text: #E2E8F0;
            --toggle-bg: #334155;

            --accent-color: #38BDF8;
            --accent-hover: #0EA5E9;
            --btn-text: #0F172A;

            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --btn-shadow: 0 4px 10px 0 rgba(56, 189, 248, 0.2);
            --btn-shadow-hover: 0 8px 15px -3px rgba(56, 189, 248, 0.4);
        }

        /* FULLSCREEN IMAGE BACKGROUND FOR NEW DESIGN */
        body {
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: var(--bg-color);
        }

        .bg-image {
            position: absolute;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.4;
            transition: opacity 0.5s ease;
        }

        body.dark-mode .bg-image {
            opacity: 0.15;
        }

        /* RTL SUPPORT */
        [dir="rtl"] { text-align: right; }
        [dir="rtl"] .ml-2 { margin-left: 0; margin-right: 0.5rem; }
        [dir="rtl"] .mr-3 { margin-left: 0.75rem; margin-right: 0; }
        [dir="rtl"] .input-icon { left: auto; right: 14px; }
        [dir="rtl"] .input-field { padding: 0 40px 0 14px !important; }
        [dir="rtl"] .btn-icon { margin-left: 0; margin-right: 6px; transform: rotate(180deg); }

        /* =========================================
           TOP CONTROLS BAR
           ========================================= */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 1.5rem 2rem;
            gap: 1rem;
            z-index: 50;
            flex-shrink: 0;
            position: absolute;
            top: 0;
            right: 0;
        }

        .toggle {
            width: 40px;
            height: 22px;
            background: var(--toggle-bg);
            border: 1px solid var(--card-border);
            border-radius: 50px;
            position: relative;
            cursor: pointer;
            transition: 0.3s;
            flex-shrink: 0;
            backdrop-filter: blur(5px);
        }

        .toggle::before {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 3px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        body.dark-mode .toggle::before {
            left: 19px;
            background: var(--accent-color);
            box-shadow: none;
        }

        .top-btn-text {
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--page-text);
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            padding: 6px 12px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
        }

        .top-btn-text:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* =========================================
           NEW FROSTED GLASS SINGLE-PANEL LAYOUT
           ========================================= */
        .main-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 2rem;
            z-index: 10;
        }

        .login-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 450px; /* Slimmer for single panel */
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: all 0.3s ease;
            padding: clamp(2rem, 5vh, 3.5rem);
            position: relative;
        }

        /* Subtle decorative gradient inside the card */
        .login-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--accent-color), var(--accent-dark));
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* HEADERS - EXACT LOGO SIZING & STYLING PRESERVED */
        .auth-logo {
            display: flex;
            justify-content: center; /* Centered for new layout */
            margin-bottom: 1.5rem;
        }

        .auth-logo a {
            color: var(--text-main) !important;
            text-decoration: none;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h2 {
            font-size: clamp(1.4rem, 3vh, 1.75rem);
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .auth-header p {
            font-size: clamp(0.8rem, 1.5vh, 0.85rem);
            color: var(--text-muted);
            margin: 0;
            font-weight: 500;
        }

        /* COMPACT VERTICAL FORM (Exact template structural rules & clamps) */
        form {
            display: flex;
            flex-direction: column;
            gap: clamp(12px, 2vh, 16px);
            margin: 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--text-main);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--input-icon);
            font-size: 0.85rem;
            pointer-events: none;
            transition: color 0.3s;
        }

        .input-field {
            width: 100%;
            height: clamp(42px, 5vh, 46px);
            padding: 0 14px 0 38px;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--input-text);
            border-radius: 12px; /* Slightly more rounded */
            font-size: 0.875rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            margin: 0;
        }

        .input-field::placeholder {
            color: var(--input-icon);
            opacity: 1;
            font-weight: 400;
        }

        .input-field:hover {
            border-color: var(--accent-color);
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent-color);
            background-color: var(--input-focus-bg);
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15);
        }

        body.dark-mode .input-field:focus {
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
        }

        .input-field:focus+.input-icon,
        .input-field:focus~.input-icon {
            color: var(--accent-color);
        }

        /* Password Field Specifics */
        .password-field { padding-right: 36px !important; }

        .password-toggle {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            color: var(--input-icon); background: none; border: none; cursor: pointer;
            padding: 4px; font-size: 0.9rem; z-index: 5; transition: color 0.3s;
        }

        .password-toggle:hover { color: var(--accent-color); }

        [dir="rtl"] .password-field { padding-right: 38px !important; padding-left: 36px !important; }
        [dir="rtl"] .password-toggle { right: auto; left: 10px; }

        /* UTILITY ROW */
        .utility-row {
            display: flex; align-items: center; justify-content: space-between;
            margin: 4px 0 0 0; padding: 0;
        }

        .custom-checkbox { display: flex; align-items: center; cursor: pointer; position: relative; }
        .custom-checkbox input { position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0; }

        .checkmark {
            height: 16px; width: 16px; background-color: var(--input-bg);
            border: 2px solid var(--input-border); border-radius: 4px; display: flex;
            align-items: center; justify-content: center; transition: all 0.2s ease;
        }

        .custom-checkbox input:checked~.checkmark { background-color: var(--accent-color); border-color: var(--accent-color); }
        .custom-checkbox input:checked~.checkmark::after {
            content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
            color: white; font-size: 9px;
        }

        body.dark-mode .custom-checkbox input:checked~.checkmark::after { color: var(--text-main); }

        /* AUTH BUTTON */
        .auth-btn {
            width: 100%; height: clamp(44px, 5vh, 48px); background: var(--accent-color);
            color: var(--btn-text); border: none; border-radius: 12px; font-size: 0.875rem;
            font-weight: 700; font-family: 'Inter', sans-serif; text-transform: none;
            letter-spacing: 0.01em; cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: var(--btn-shadow); margin-top: 8px;
        }

        .auth-btn:hover { background: var(--accent-hover); box-shadow: var(--btn-shadow-hover); transform: translateY(-2px); }
        .auth-btn:active { transform: translateY(0); }

        /* DIVIDER */
        .divider { text-align: center; position: relative; margin: 12px 0; }
        .divider::before { content: ''; position: absolute; left: 0; top: 50%; width: 100%; height: 1px; background: var(--input-border); }
        .divider span {
            position: relative; background: var(--bg-card); padding: 0 12px; color: var(--text-muted);
            font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; z-index: 1;
        }

        /* SOCIALS */
        .social-login { display: flex; justify-content: space-between; gap: 10px; }
        .social-btn {
            flex: 1; height: 42px; border: 1px solid var(--input-border); border-radius: 12px;
            background-color: var(--input-bg); font-size: 1rem; color: var(--text-muted);
            cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center;
            justify-content: center; font-family: 'Inter', sans-serif;
        }

        .social-btn:hover {
            border-color: var(--accent-color); color: var(--accent-color);
            background-color: rgba(14, 165, 233, 0.05); transform: translateY(-2px);
        }

        body.dark-mode .social-btn:hover { background-color: rgba(56, 189, 248, 0.08); }

        /* FOOTER LINKS */
        .login-link { text-align: center; font-size: 0.8rem; color: var(--text-muted); font-weight: 500; margin-top: 1.5rem; }
        .login-link a { color: var(--accent-color); font-weight: 800; text-decoration: none; transition: all 0.2s; }
        .login-link a:hover { color: var(--accent-hover); text-decoration: underline; }

        /* RESPONSIVENESS PRESERVED FROM TEMPLATE */
        @media (max-width: 768px), (max-height: 650px) {
            .main-wrapper { padding: 1rem; }
            .login-container { max-width: 400px; border-radius: 20px; padding: 1.5rem; }
            form { gap: 12px !important; }
            .auth-header p { display: none; }
            .input-field { height: 42px !important; font-size: 0.8rem !important; }
            .auth-btn { height: 44px !important; }
            .social-btn { height: 40px !important; font-size: 0.9rem !important; }
            .utility-row span, .utility-row a { font-size: 0.7rem !important; }
        }
    </style>
</head>

<body>
    <!-- Fullscreen Photography Background -->
    <img src="images/pexels-dacostashotit-39714850.jpg" class="bg-image" alt="Photography Background">

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="flex items-center gap-2" style="cursor: pointer;" onclick="document.getElementById('theme-toggle').click()">
            <i class="fas fa-sun text-xs" style="color: var(--page-text); transition: color 0.3s;"></i>
            <div class="toggle" id="theme-toggle"></div>
            <i class="fas fa-moon text-xs" style="color: var(--page-text); transition: color 0.3s;"></i>
        </div>
        <button id="rtl-toggle" class="top-btn-text">RTL Mode</button>
    </div>

    <!-- MAIN CENTERED CONTENT -->
    <div class="main-wrapper">
        <div class="login-container">

            <!-- EXACT LOGO SIZING & FRONT-END DESIGN PRESERVED -->
            <div class="auth-logo">
                <a href="index.html" class="inline-flex items-center gap-2 text-2xl font-black tracking-tight uppercase"
                    style="color: var(--text-main) !important; text-decoration: none;">
                    <i class="fas fa-camera-retro" style="color: var(--accent-color); font-size: 1.4rem;"></i>
                    LensCraft
                </a>
            </div>

            <div class="auth-header">
                <h2>Welcome to the Studio</h2>
                <p>Sign in to view your galleries and bookings.</p>
            </div>

            <!-- FORM WITH TEMPLATE DOM STRUCTURE & SIZING -->
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" class="input-field" placeholder="client@example.com" required>
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="input-field password-field" placeholder="••••••••" required>
                        <i class="fas fa-lock input-icon"></i>
                        <button type="button" class="password-toggle" id="toggle-password" tabindex="-1" aria-label="Toggle password visibility">
                            <i class="fas fa-eye" id="toggle-icon"></i>
                        </button>
                    </div>
                </div>

                <!-- BUTTON & UTILITY PLACEMENT PRESERVED -->
                <div class="utility-row">
                    <label class="custom-checkbox">
                        <input type="checkbox">
                        <div class="checkmark"></div>
                        <span class="ml-2 text-[0.7rem] font-semibold" style="color: var(--text-muted);">Remember me</span>
                    </label>
                    <a href="#" class="text-[0.7rem] font-bold transition whitespace-nowrap hover:opacity-80" style="color: var(--accent-color);">Forgot Password?</a>
                </div>

                <button type="submit" class="auth-btn">Sign In <i class="fas fa-arrow-right ml-2 text-xs"></i></button>
            </form>

            <div class="divider"><span>Or authenticate with</span></div>

            <!-- 3 SOCIAL BUTTONS PRESERVED -->
            <div class="social-login">
                <button class="social-btn" type="button" title="Sign in with Google"><i class="fab fa-google"></i></button>
                <button class="social-btn" type="button" title="Sign in with Apple"><i class="fab fa-apple"></i></button>
                <button class="social-btn" type="button" title="Sign in with X"><i class="fa-brands fa-x-twitter"></i></button>
            </div>

            <div class="login-link">
                New client? <a href="register.html">Book a Session</a>
            </div>
        </div>
    </div>

    <script>
        // --- THEME LOGIC ---
        const themeToggle = document.getElementById('theme-toggle');
        const savedTheme = localStorage.getItem('theme') || 'light';

        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            themeToggle.classList.add('active');
        }

        themeToggle.onclick = (e) => {
            e.stopPropagation();
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeToggle.classList.toggle('active', isDark);
        };

        // --- RTL LOGIC ---
        const rtlToggle = document.getElementById('rtl-toggle');
        const savedDir = localStorage.getItem('dir') || 'ltr';

        if (savedDir === 'rtl') {
            document.documentElement.dir = 'rtl';
            rtlToggle.innerText = "LTR MODE";
        }

        rtlToggle.onclick = () => {
            const isRTL = document.documentElement.dir === 'rtl';
            document.documentElement.dir = isRTL ? 'ltr' : 'rtl';
            localStorage.setItem('dir', isRTL ? 'ltr' : 'rtl');
            rtlToggle.innerText = isRTL ? 'RTL MODE' : 'LTR MODE';
        };

        // --- PASSWORD TOGGLE LOGIC ---
        const togglePasswordBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggle-icon');

        togglePasswordBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            toggleIcon.className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
        });

        // --- FORM SUBMISSION ---
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            // Directing to the new user dashboard
            window.location.href = 'user.html'; 
        });
    </script>
</body>

</html>
